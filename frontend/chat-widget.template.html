<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LG Product Assistant — Widget</title>
  <style>
    /* This page only exists to host the chat widget script inside a small,
       fixed-size iframe (see chat.template.html) so the widget's own
       bottom-right floating panel fills that frame instead of floating in
       the corner of the recipient's full browser window. */
    html, body { margin: 0; padding: 0; height: 100%; background: transparent; }
  </style>
</head>
<body>
  <!-- data-user-endpoint carries "contactId:<id>" (built server-side in
       server.js's /chat-widget route from ?contactId=) so the underlying
       yflow's userEndpoint contract input receives it and can route straight
       to a contact-ID lookup instead of asking the lead for it. This is a
       best-effort convention (matches the naming of the other data-* attrs
       below) - not officially documented for this widget. If it turns out
       unsupported, the flow's existing "ask for Contact ID" fallback still
       works, so there's no regression either way. -->
  <script
    id="ixhello-chat-widget"
    type="module"
    src="{{WIDGET_SRC}}"
    data-org-id="{{WIDGET_ORG_ID}}"
    data-chat-widget-id="{{WIDGET_ID}}"
    data-flow-id="{{WIDGET_FLOW_ID}}"
    data-user-endpoint="{{USER_ENDPOINT}}"
  ></script>
</body>
</html>
